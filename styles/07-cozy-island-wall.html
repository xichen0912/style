<title>Berkeley Looks Out Island</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: same two stages (16:9 wall + phone) seen front-on from a gentle height, like a cozy island game: grass tiers with striped cliffs, rivers with pale rims, cottages with big roofs, round villagers with speech bubbles. Single light look by choice. */
:root{
  --page:#EAF3D6;
  --ink:#6B4F2A;
  --mute:#94784F;
  --cream:#FFF8E7;
  --cream2:#F6EBCB;
  --yellow:#F8D35E;
  --leaf:#7ACB5C;
  --f:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
  color-scheme: light;
}
html,body{background:var(--page);color:var(--ink)}
body{font-family:var(--f);font-size:16px;font-weight:600}
.shell{max-width:1480px;margin:0 auto;padding-block:24px 48px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));display:flex;flex-direction:column;gap:22px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px}
.brand{display:flex;align-items:center;gap:12px}
.brand h1{margin:0;font-weight:800;font-size:28px;line-height:1}
.brand p{margin:2px 0 0;color:var(--mute);font-weight:500}
.ctrls{display:flex;gap:12px;flex-wrap:wrap}
.btn{font-family:var(--f);font-weight:700;font-size:15px;height:46px;padding:0 20px;border:0;border-radius:24px;background:var(--cream);color:var(--ink);cursor:pointer;box-shadow:0 4px 0 #D9C79A}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #D9C79A}
.btn.primary{background:var(--yellow);box-shadow:0 4px 0 #D3A93A}
.btn:focus-visible,.chip:focus-visible,.ask:focus-visible,.x:focus-visible,.hit:focus-visible,input:focus-visible{outline:3px solid #4F8FE0;outline-offset:3px}
.stages{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:32px;align-items:start}
@media (max-width:980px){.stages{grid-template-columns:minmax(0,1fr)}.fig-phone{justify-self:center;width:100%;max-width:360px}}
figure{margin:0;display:flex;flex-direction:column;gap:10px;min-width:0}
figcaption{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:15px;font-weight:500;color:var(--mute)}
figcaption b{font-weight:700;color:var(--ink)}
.wall-frame{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;overflow:hidden;border-radius:26px;background:#7FD3F5;box-shadow:0 6px 0 #C9DDAA, 0 14px 30px rgba(107,79,42,.15)}
.phone-frame{position:relative;width:100%;aspect-ratio:390/844;max-width:100%;border-radius:52px;padding:10px;box-sizing:border-box;background:#F8D35E;box-shadow:0 6px 0 #D3A93A, 0 14px 30px rgba(107,79,42,.2)}
.phone-clip{position:relative;width:100%;height:100%;border-radius:42px;overflow:hidden;background:#7FD3F5}
.scaler{position:absolute;left:0;top:0;transform-origin:0 0}
svg text{font-family:var(--f)}
.pop{transform-box:fill-box;transform-origin:50% 100%;animation:pop .5s cubic-bezier(.3,1.8,.5,1) both}
@keyframes pop{0%{transform:scale(0)}100%{transform:scale(1)}}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.flow{animation:flow 1.6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-60}}
.fall{animation:fall .6s linear infinite}
@keyframes fall{to{stroke-dashoffset:-24}}
.wave{animation:wave 3.2s ease-in-out infinite}
@keyframes wave{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}
.fade{transition:opacity .4s}

/* ---------- WALL ---------- */
.wall{width:1600px;height:900px;position:relative;overflow:hidden;background:#7FD3F5}
.wall svg{position:absolute;left:0;top:0}
.w-card{position:absolute;right:38px;top:38px;bottom:38px;width:420px;box-sizing:border-box;padding:30px 30px 28px;background:var(--cream);border-radius:40px;box-shadow:0 8px 0 #E2D2A6, 0 20px 40px rgba(107,79,42,.18);display:flex;flex-direction:column;gap:20px}
.w-card .head{display:flex;align-items:center;gap:12px;font-weight:700;font-size:18px;color:var(--mute)}
.w-card h2{margin:-6px 0 0;font-weight:800;font-size:50px;line-height:1}
.w-card h2 small{display:block;font-weight:600;font-size:22px;color:var(--mute);margin-top:6px}
.w-score{display:flex;align-items:center;gap:16px;padding:14px 20px;border-radius:28px;background:var(--cream2)}
.w-score b{display:flex;align-items:center;justify-content:center;min-width:86px;height:86px;border-radius:50%;background:var(--yellow);font-weight:800;font-size:48px;line-height:1;box-shadow:0 4px 0 #D3A93A;font-variant-numeric:tabular-nums}
.w-score span{font-size:21px;line-height:1.25}
.legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 18px}
.legend div{display:flex;align-items:center;gap:10px;font-size:21px;transition:opacity .4s}
.legend i{width:22px;height:22px;border-radius:50%;flex:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
.legend em{margin-left:auto;font-style:normal;color:var(--mute)}
.legend div.zero{opacity:.35}
.dialog{position:relative;margin-top:auto;padding:26px 22px 18px;border-radius:30px 34px 28px 36px;background:#FFFDF5;box-shadow:inset 0 0 0 3px var(--cream2)}
.dialog .name{position:absolute;left:18px;top:-16px;padding:2px 16px;border-radius:16px;background:#E9774A;color:#fff;font-weight:800;font-size:18px;transform:rotate(-4deg);box-shadow:0 3px 0 rgba(0,0,0,.12)}
.dialog b{display:block;font-weight:700;font-size:25px;line-height:1.25}
.dialog span{display:block;font-weight:500;font-size:18px;color:var(--mute);margin-top:4px}
.w-tl{position:absolute;left:26px;top:22px;display:flex;align-items:center;gap:10px;padding:8px 18px 8px 10px;border-radius:26px;background:var(--cream);box-shadow:0 4px 0 #E2D2A6;font-weight:800;font-size:20px}

/* ---------- PHONE ---------- */
.ph{width:390px;height:844px;position:relative;overflow:hidden;background:#7FD3F5;font-family:var(--f);color:var(--ink)}
.ph svg.map{position:absolute;left:0;top:0}
.p-card{position:absolute;left:12px;right:12px;top:36px;padding:14px;background:var(--cream);border-radius:28px;box-shadow:0 5px 0 #E2D2A6, 0 10px 24px rgba(107,79,42,.15);display:flex;flex-direction:column;gap:10px}
.p-card .r1{display:flex;justify-content:space-between;align-items:center}
.p-card .r1 h3{margin:0;display:flex;align-items:center;gap:8px;font-weight:800;font-size:22px}
.p-card .r1 span{font-weight:600;font-size:13px;color:var(--mute)}
.srch{display:flex;align-items:center;gap:8px;height:42px;padding:0 14px;border-radius:21px;background:var(--cream2)}
.srch input{flex:1;min-width:0;height:100%;border:0;background:none;font-family:var(--f);font-weight:600;font-size:16px;color:var(--ink);padding:0}
.srch input::placeholder{color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px 0 8px;border:0;border-radius:16px;background:var(--cream2);color:var(--ink);font-family:var(--f);font-weight:700;font-size:13px;cursor:pointer}
.chip i{width:12px;height:12px;border-radius:50%}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--cream)}
.p-bot{position:absolute;left:14px;right:14px;bottom:22px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;pointer-events:none}
.p-note{padding:8px 12px;border-radius:18px;background:rgba(255,248,231,.94);font-weight:500;font-size:13px;line-height:1.25;max-width:190px;box-shadow:0 3px 0 #E2D2A6}
.round{pointer-events:auto;width:68px;height:68px;border-radius:50%;border:0;background:var(--yellow);color:var(--ink);font-family:var(--f);font-weight:800;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 5px 0 #D3A93A}
.hit{cursor:pointer;outline:none}
.sheet{position:absolute;left:10px;right:10px;bottom:10px;padding:30px 18px 18px;background:#FFFDF5;border-radius:32px;box-shadow:0 -4px 0 var(--cream2), 0 -10px 30px rgba(107,79,42,.2);display:flex;flex-direction:column;gap:10px;transform:translateY(calc(100% + 40px));visibility:hidden;transition:transform .4s cubic-bezier(.3,1.4,.5,1), visibility 0s linear .4s}
.sheet.open{transform:none;visibility:visible;transition:transform .4s cubic-bezier(.3,1.4,.5,1)}
.sheet .name{position:absolute;left:18px;top:-14px;padding:2px 14px;border-radius:14px;color:#fff;font-weight:800;font-size:16px;transform:rotate(-4deg);box-shadow:0 3px 0 rgba(0,0,0,.12)}
.sheet .sub{margin:0;font-weight:500;font-size:15px;color:var(--mute)}
.x{position:absolute;right:12px;top:10px;width:44px;height:44px;border-radius:50%;border:0;background:var(--cream2);color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center}
.prow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:18px;background:var(--cream)}
.prow i{width:14px;height:14px;border-radius:50%;flex:none}
.prow .meta{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}
.prow .meta b{font-weight:700;font-size:17px}
.prow .meta span{font-weight:500;font-size:14px;color:var(--mute)}
.ask{height:38px;padding:0 16px;border:0;border-radius:19px;background:var(--yellow);color:var(--ink);font-family:var(--f);font-weight:800;font-size:14px;cursor:pointer;box-shadow:0 3px 0 #D3A93A}
.starter{font-weight:600;font-size:19px;line-height:1.3}
.more{margin:0;font-weight:500;font-size:14px;color:var(--mute)}
.toast{position:absolute;left:50%;top:256px;transform:translate(-50%,-6px);opacity:0;display:flex;align-items:center;gap:8px;padding:6px 14px 6px 8px;border-radius:18px;background:var(--cream);box-shadow:0 3px 0 #E2D2A6;font-weight:700;font-size:14px;white-space:nowrap;transition:.3s;pointer-events:none}
.toast i{width:14px;height:14px;border-radius:50%}
.toast.show{opacity:1;transform:translate(-50%,0)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation:none !important;transition:none !important} }
</style>

          <div class="w-tl"><svg width="28" height="28" viewBox="0 0 40 40" aria-hidden="true"><path d="M20 4C9 8 5 18 8 30c12 2 24-6 26-24C30 4 24 3 20 4z" fill="#7ACB5C"/><path d="M10 31C16 22 22 15 31 8" stroke="#4E9E3C" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>Looks Out</div>
          <div class="w-card">
            <div class="head"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="9" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M11 6v5l3 2" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg><span id="wClock">Live</span></div>

        </div>
      </div></div>
      <figcaption><b>Resource wall</b><span>Wurster Hall lobby · 16:9 screen</span></figcaption>
    </figure>
    <figure class="fig-phone">
      <div class="phone-frame"><div class="phone-clip" id="phoneClip"><div class="scaler" id="phoneScaler">
        <div class="ph">
          <svg class="map" id="phoneSvg" width="390" height="844" viewBox="0 0 390 844" role="group" aria-label="The Berkeley campus drawn as a cozy island. Buildings where neighbors offer help carry a bubble with an icon and a count."></svg>
          <div class="p-card">
            <div class="r1"><h3><svg width="24" height="24" viewBox="0 0 40 40" aria-hidden="true"><path d="M20 4C9 8 5 18 8 30c12 2 24-6 26-24C30 4 24 3 20 4z" fill="#7ACB5C"/><path d="M10 31C16 22 22 15 31 8" stroke="#4E9E3C" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>Looks Out</h3><span id="pClock">Live</span></div>
            <div class="srch">
              <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="#94784F" stroke-width="2"/><path d="M11 11l4 4" stroke="#94784F" stroke-width="2" stroke-linecap="round"/></svg>
              <label class="sr" for="q">Search skills and resources</label>
              <input id="q" type="search" placeholder="What are you looking for?">
            </div>
            <div class="chips" id="chips" role="group" aria-label="Filter by kind of help"></div>
          </div>
          <div class="p-bot"><span class="p-note">A drawn campus. Bubbles show buildings, never where a person is.</span><button class="round" id="offer" type="button" aria-label="Offer something"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M11 3v16M3 11h16" stroke="#6B4F2A" stroke-width="3.5" stroke-linecap="round"/></svg>Offer</button></div>
          <div class="toast" id="toast" role="status"></div>
          <div class="sheet" id="sheet" aria-live="polite"></div>
        </div>
      </div></div></div>
      <figcaption><b>Campus map</b><span>Tap a bubble to meet your neighbors</span></figcaption>
    </figure>
  </div>
</div>
