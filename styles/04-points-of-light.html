<style>
/* Layout: same two stages (16:9 wall + phone). Each is a slowly turning field of light: resources are pixel icons made of glowing particles, threads of particles connect them over a dotted ground. Text sits in open columns, not boxes. Single dark look by choice. */
:root{
  --bg:#04050A;
  --ink:#F2F3F7;
  --mute:rgba(242,243,247,.6);
  --line:rgba(242,243,247,.2);
  --blue:#8EA2FF;
  --amber:#FFB86B;
  --sheet:#0B0D16;
  --f-title:'Instrument Serif', Georgia, serif;
  --f:'Instrument Sans', 'Helvetica Neue', Arial, sans-serif;
  --f-mono:'JetBrains Mono', ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f);font-size:15px}
.shell{max-width:1480px;margin:0 auto;padding-block:26px 48px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));display:flex;flex-direction:column;gap:22px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px}
.top h1{margin:0;font-family:var(--f-title);font-style:italic;font-weight:400;font-size:38px;line-height:1}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--mute)}
.ctrls{display:flex;gap:10px;flex-wrap:wrap}
.btn{font-family:var(--f-mono);font-size:12px;letter-spacing:1px;text-transform:uppercase;height:40px;padding:0 16px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.btn.primary{border-color:var(--blue);color:var(--blue)}
.btn:hover{border-color:rgba(242,243,247,.5)}
.btn:focus-visible,.tab:focus-visible,.ask:focus-visible,.x:focus-visible,.bnav button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.stages{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:32px;align-items:start}
@media (max-width:980px){.stages{grid-template-columns:minmax(0,1fr)}.fig-phone{justify-self:center;width:100%;max-width:360px}}
figure{margin:0;display:flex;flex-direction:column;gap:10px;min-width:0}
figcaption{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--mute)}
figcaption b{font-family:var(--f-mono);font-weight:500;font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--ink)}
.wall-frame{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;overflow:hidden;background:var(--bg);box-shadow:0 0 0 1px var(--line)}
.phone-frame{position:relative;width:100%;aspect-ratio:390/844;max-width:100%;border-radius:48px;padding:8px;box-sizing:border-box;background:#14161F;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.phone-clip{position:relative;width:100%;height:100%;border-radius:40px;overflow:hidden;background:var(--bg)}
.scaler{position:absolute;left:0;top:0;transform-origin:0 0}
canvas{display:block;touch-action:pan-y;cursor:grab}
canvas:active{cursor:grabbing}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}

/* ---------- WALL ---------- */
.wall{width:1600px;height:900px;position:relative;overflow:hidden;background:var(--bg);font-family:var(--f)}
.wall canvas{position:absolute;left:0;top:0;width:1600px;height:900px}
.w-col{position:absolute;right:64px;top:64px;bottom:60px;width:380px;display:flex;flex-direction:column;gap:30px;pointer-events:none}
.w-col .eyebrow{font-size:15px}
.w-col h2{margin:-14px 0 0;font-family:var(--f-title);font-style:italic;font-weight:400;font-size:62px;line-height:1}
.w-num{display:flex;align-items:flex-end;gap:16px;padding-top:24px;border-top:1px solid var(--line)}
.w-num b{font-family:var(--f-title);font-weight:400;font-size:132px;line-height:.78}
.w-num span{font-size:21px;line-height:1.3;color:var(--mute);padding-bottom:6px}
.legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 22px}
.legend div{display:flex;align-items:center;gap:10px;font-size:20px;transition:opacity .5s}
.legend div em{margin-left:auto;font-style:normal;font-family:var(--f-mono);font-size:17px;color:var(--mute)}
.legend div.zero{opacity:.32}
.w-new{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding-top:20px;border-top:1px solid var(--line)}
.w-new b{font-weight:500;font-size:26px;line-height:1.2}
.w-new span{font-size:17px;color:var(--mute)}
.w-tl{position:absolute;left:64px;top:64px;pointer-events:none}
.w-tl .eyebrow{font-size:15px}
.w-bl{position:absolute;left:64px;bottom:60px;font-family:var(--f-mono);font-size:15px;letter-spacing:1px;color:var(--mute);pointer-events:none}
.w-bl b{color:var(--ink);font-weight:500}

/* ---------- PHONE ---------- */
.ph{width:390px;height:844px;position:relative;overflow:hidden;background:var(--bg);font-family:var(--f);color:var(--ink)}
.ph canvas{position:absolute;left:0;top:0;width:390px;height:844px}
.p-top{position:absolute;left:0;right:0;top:0;padding:30px 22px 26px;display:flex;flex-direction:column;gap:14px;background:linear-gradient(var(--bg) 72%, rgba(4,5,10,0))}
.p-top .r1{display:flex;justify-content:space-between;align-items:baseline}
.p-top h3{margin:0;font-family:var(--f-title);font-style:italic;font-weight:400;font-size:32px;line-height:1}
.srch{display:flex;align-items:center;gap:10px;height:40px;border-bottom:1px solid rgba(242,243,247,.35)}
.srch input{flex:1;min-width:0;height:100%;background:none;border:0;color:var(--ink);font-family:var(--f);font-size:16px;padding:0}
.srch input::placeholder{color:var(--mute)}
.tabs{display:flex;gap:4px 14px;flex-wrap:wrap}
.tab{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0;background:none;border:0;border-bottom:1px solid transparent;color:var(--mute);font-family:var(--f-mono);font-size:11px;letter-spacing:1px;text-transform:uppercase;cursor:pointer}
.tab .dot{width:6px;height:6px}
.tab[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.p-foot{position:absolute;left:22px;right:22px;bottom:26px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.p-foot span{font-family:var(--f-mono);font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:var(--mute);line-height:1.5;max-width:170px}
.p-foot .btn{height:44px;font-size:11px;padding:0 14px}
.bnav{position:absolute;left:12px;right:12px;bottom:80px;display:flex;flex-wrap:wrap;gap:6px;opacity:0;pointer-events:none}
.bnav:focus-within{opacity:1;pointer-events:auto}
.bnav button{font-family:var(--f-mono);font-size:11px;background:var(--bg);color:var(--ink);border:1px solid var(--line);height:32px;padding:0 10px}
.sheet{position:absolute;left:0;right:0;bottom:0;padding:24px 22px 30px;background:var(--sheet);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:14px;transform:translateY(calc(100% + 20px));visibility:hidden;transition:transform .45s cubic-bezier(.2,.9,.3,1.1), visibility 0s linear .45s}
.sheet.open{transform:none;visibility:visible;transition:transform .45s cubic-bezier(.2,.9,.3,1.1)}
.sh-head{display:flex;align-items:flex-start;gap:10px}
.sh-head h4{margin:2px 0 0;font-family:var(--f-title);font-style:italic;font-weight:400;font-size:30px;line-height:1}
.x{margin-left:auto;flex:none;width:44px;height:44px;margin:-10px -10px 0 auto;border:0;background:none;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center}
.prow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.prow .meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.prow .meta b{font-weight:500;font-size:17px}
.prow .meta span{font-size:13px;color:var(--mute)}
.ask{height:38px;padding:0 14px;border:1px solid var(--line);background:none;color:var(--ink);font-family:var(--f-mono);font-size:11px;letter-spacing:1px;text-transform:uppercase;cursor:pointer}
.starter{font-family:var(--f-title);font-style:italic;font-size:24px;line-height:1.2}
.more{margin:0;font-size:13px;color:var(--mute)}
.toast{position:absolute;left:22px;right:22px;top:250px;display:flex;align-items:center;gap:8px;opacity:0;transform:translateY(-6px);font-family:var(--f-mono);font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--ink);transition:.3s;pointer-events:none}
.toast.show{opacity:1;transform:none}
@media (prefers-reduced-motion: reduce){ *{transition:none !important} }
</style>

<div class="shell">
  <div class="top">

    <div class="ctrls">

      <button class="btn" id="pause" type="button" aria-pressed="false">Pause motion</button>
    </div>
  </div>
  <div class="stages">
    <figure>

          <div class="w-tl"><div class="eyebrow">Berkeley Looks Out</div></div>
          <div class="w-col">
            <div class="eyebrow">Wurster Hall · live</div>
            <h2>Our building, our resources</h2>
            <div class="w-num"><b id="wCount">12</b><span>people here<br>offering something</span></div>
            <div class="legend" id="legend"></div>
            <div class="w-new"><div class="eyebrow" id="wNewEy">How it works</div><b id="wNew">Only people who opt in appear</b><span id="wNewSub">Your icon arrives with you and leaves with you</span></div>
          </div>
          <div class="w-bl"><b>Tap the label</b> beside this screen to add yours</div>
        </div>
      </div></div>
      <figcaption><b>Resource wall</b><span>Wurster Hall lobby · 16:9 · drag to turn</span></figcaption>
    </figure>
    <figure class="fig-phone">
      <div class="phone-frame"><div class="phone-clip" id="phoneClip"><div class="scaler" id="phoneScaler">
        <div class="ph">
          <canvas id="phoneCanvas" aria-label="Campus drawn in points of light. Buildings rise with the number of people offering inside."></canvas>
          <div class="p-top">
            <div class="r1"><h3>Looks Out</h3><span class="eyebrow">Campus · live</span></div>
            <div class="srch">
              <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="rgba(242,243,247,.6)" stroke-width="1.4"/><path d="M11 11l4 4" stroke="rgba(242,243,247,.6)" stroke-width="1.4"/></svg>
              <label class="sr" for="q">Search skills and resources</label>
              <input id="q" type="search" placeholder="What are you looking for?">
            </div>
            <div class="tabs" id="tabs" role="group" aria-label="Filter by resource"></div>
          </div>
          <nav class="bnav" id="bnav" aria-label="Buildings"></nav>
          <div class="p-foot"><span>Buildings only. Nobody's live location.</span><button class="btn" id="offer" type="button">+ Offer</button></div>
          <div class="toast" id="toast" role="status"></div>
          <div class="sheet" id="sheet" aria-live="polite"></div>
        </div>
      </div></div></div>
      <figcaption><b>Campus map</b><span>Tap a building · drag to turn</span></figcaption>
    </figure>
  </div>
</div>

  var pc=document.getElementById('phoneClip'); document.getElementById('phoneScaler').style.transform='scale('+(pc.clientWidth/390)+')';
}
fit(); window.addEventListener('resize',fit);
if(window.ResizeObserver){ var ro=new ResizeObserver(fit); ro.observe(document.getElementById('wallFrame')); ro.observe(document.getElementById('phoneClip')); }
setInterval(function(){ if(paused||reduce) return; Math.random()<.55?arrive():depart(); },4800);
document.getElementById('arrive').addEventListener('click',arrive);
var pb=document.getElementById('pause');
pb.addEventListener('click',function(){ paused=!paused; pb.setAttribute('aria-pressed',String(paused)); pb.textContent=paused?'Resume motion':'Pause motion'; });
})();
</script>
