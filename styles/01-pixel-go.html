<title>Berkeley Looks Out</title>

<style>
/* Layout: two device stages side by side (16:9 wall + phone), stacking at narrow widths. Day and night are a deliberate in-page switch, not the viewer's theme. */
:root{
  --page:#E3E9F4; --page-ink:#1B2A55; --page-mute:#56638A; --page-card:#FFFFFF;
  --hue:#2C55D8; --hue-deep:#18307F;
  /* wall */
  --w-bg:#F1F4FB; --w-ink:#18307F; --w-hue:#2C55D8; --w-px:#2C55D8; --w-mute:#3D57A8;
  --w-glow:rgba(44,85,216,.45); --w-blob:rgba(44,85,216,.34); --w-halo:rgba(44,85,216,.30); --w-line:rgba(44,85,216,.35); --w-blend:normal;
  /* phone */
  --sky:linear-gradient(#5DB9FF 0, #A9DEFF 70px, #E6F7FF 130px, #E6F7FF 100%);
  --fog:linear-gradient(#E6F7FF 10%, rgba(230,247,255,0));
  --ground:#A8E2A0; --grid:rgba(255,255,255,.22); --park:#C4EEAD; --road:#FFF8E1; --road-edge:#E2D39B; --water:#78D0F2;
  --roof:#F7F5FF; --roof-edge:#E3DEF8; --roof-ink:#6B6496; --wall-s:#D8D2F0; --wall-side:#C4BDE4; --win:rgba(255,255,255,.55);
  --hud-bg:rgba(255,255,255,.94); --hud-solid:#FFFFFF; --hud-soft:#F1F4FB; --hud-ink:#24305A; --hud-mute:#56638A; --hud-accent:#2C55D8; --hud-line:#BFCBEB;
  --tok-glow:0 0 0 4px rgba(255,255,255,.9), 0 0 24px 6px rgba(44,85,216,.55);
  --f-display:'Silkscreen', 'Courier New', monospace;
  --f-body:'Pixelify Sans', 'Trebuchet MS', system-ui, sans-serif;
  color-scheme: light;
}
body.night{
  --page:#0B0F1C; --page-ink:#DCE4F7; --page-mute:#8D99BA; --page-card:#151B2E;
  --w-bg:#04060E; --w-ink:#DCE6FF; --w-hue:#7C9CFF; --w-px:#B4C8FF; --w-mute:#93A6DD;
  --w-glow:rgba(120,155,255,.95); --w-blob:rgba(58,96,255,.45); --w-halo:rgba(90,128,255,.45); --w-line:rgba(124,156,255,.4); --w-blend:screen;
  --sky:linear-gradient(#060B26 0, #13215A 80px, #1E2E66 140px, #1E2E66 100%);
  --fog:linear-gradient(#1E2E66 10%, rgba(30,46,102,0));
  --ground:#1F4A47; --grid:rgba(160,220,255,.07); --park:#265C4F; --road:#3A4A7C; --road-edge:#283563; --water:#1A4778;
  --roof:#2E3B6B; --roof-edge:#3B4A80; --roof-ink:#A9B6E6; --wall-s:#1E2850; --wall-side:#18204A; --win:#FFC56A;
  --hud-bg:rgba(16,22,48,.9); --hud-solid:#141B38; --hud-soft:#1E2850; --hud-ink:#E6ECFF; --hud-mute:#A3AFD6; --hud-accent:#8FB0FF; --hud-line:#3A4A80;
  --tok-glow:0 0 0 4px rgba(190,210,255,.85), 0 0 34px 12px rgba(80,120,255,.85);
  color-scheme: dark;
}
html,body{background:var(--page);color:var(--page-ink)}
body{font-family:var(--f-body);font-size:15px;transition:background .5s}
.shell{max-width:1480px;margin:0 auto;padding-block:28px 48px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));display:flex;flex-direction:column;gap:22px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:22px;letter-spacing:2px;text-wrap:balance}
.ctrls{display:flex;gap:10px;flex-wrap:wrap}
.seg{display:flex;border:2px solid var(--page-ink)}
.seg button{font-family:var(--f-display);font-size:12px;letter-spacing:1px;height:40px;padding:0 14px;border:0;background:var(--page-card);color:var(--page-ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--page-ink);color:var(--page)}
.btn{font-family:var(--f-display);font-size:12px;letter-spacing:1px;height:44px;padding:0 14px;border:2px solid var(--page-ink);background:var(--page-card);color:var(--page-ink);cursor:pointer}
.seg button{height:40px}
.btn.primary{background:var(--hue);border-color:var(--hue);color:#FFFFFF}
.btn:focus-visible,.seg button:focus-visible,.hud-btn:focus-visible,.main-btn:focus-visible,.nearby:focus-visible,.mk:focus-visible,.av:focus-visible,.row-ask:focus-visible,.big-ask:focus-visible,.sh-x:focus-visible{outline:3px solid #FFB938;outline-offset:2px}
.stages{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:28px;align-items:start}
@media (max-width:980px){.stages{grid-template-columns:minmax(0,1fr)}.fig-phone{justify-self:center;width:100%;max-width:360px}}
figure{margin:0;display:flex;flex-direction:column;gap:10px;min-width:0}
figcaption{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--page-mute)}
figcaption b{font-family:var(--f-display);font-weight:400;font-size:12px;letter-spacing:1px;color:var(--page-ink)}
.wall-frame{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;overflow:hidden;background:var(--w-bg);box-shadow:0 0 0 10px #20242E, 0 20px 50px rgba(10,20,50,.3)}
.phone-frame{position:relative;width:100%;aspect-ratio:390/844;max-width:100%;border-radius:46px;background:#20242E;padding:10px;box-sizing:border-box;box-shadow:0 20px 50px rgba(10,20,50,.3)}
.phone-clip{position:relative;width:100%;height:100%;border-radius:36px;overflow:hidden;background:#1E2E66}
.scaler{position:absolute;left:0;top:0;transform-origin:0 0}
.only-night{display:none !important}
body.night .only-night{display:block !important}
body.night .only-day{display:none !important}

/* ---------- WALL ---------- */
.wall{width:1600px;height:900px;position:relative;overflow:hidden;background:var(--w-bg);color:var(--w-ink);font-family:var(--f-body);transition:background .6s}
.blob{position:absolute;border-radius:50%;background:radial-gradient(circle, var(--w-blob), transparent 68%);mix-blend-mode:var(--w-blend);filter:blur(30px);animation:drift 24s ease-in-out infinite alternate}
.b1{width:900px;height:900px;left:-260px;top:-320px}
.b2{width:760px;height:760px;right:-200px;top:180px;animation-duration:30s;animation-delay:-8s}
.b3{width:620px;height:620px;left:520px;bottom:-380px;animation-duration:27s;animation-delay:-14s;opacity:.8}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(80px,40px) scale(1.12)}100%{transform:translate(-40px,90px) scale(.95)}}
.wall-in{position:relative;height:100%;box-sizing:border-box;padding:60px 92px 0;display:flex;flex-direction:column}
.wall-head{display:flex;justify-content:space-between;align-items:flex-start}
.wall-head h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:44px;line-height:1.18;letter-spacing:5px;color:var(--w-ink)}
body.night .wall-head h2{text-shadow:0 0 18px var(--w-glow)}
.live{display:flex;flex-direction:column;align-items:flex-end;gap:10px;padding-top:6px}
.live .bld{font-family:var(--f-display);font-size:19px;letter-spacing:3px}
.live .cnt{display:flex;align-items:center;gap:10px;font-size:19px;color:var(--w-hue)}
.dot{width:10px;height:10px;background:var(--w-hue);animation:ping 2s ease-out infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 var(--w-glow)}100%{box-shadow:0 0 0 14px transparent}}
.grid{margin-top:44px;display:flex;flex-direction:column;gap:22px}
.row{position:relative;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));height:178px}
.row::before{content:"";position:absolute;left:0;right:0;top:104px;height:4px;background-image:repeating-linear-gradient(90deg, var(--w-line) 0 4px, transparent 4px 12px)}
.slot{position:relative;display:flex;flex-direction:column;align-items:center}
.halo{position:absolute;left:50%;top:58px;width:250px;height:250px;margin:-125px 0 0 -125px;border-radius:50%;background:radial-gradient(circle, var(--w-halo), transparent 64%);mix-blend-mode:var(--w-blend);filter:blur(8px);opacity:0;transform:scale(.5);transition:opacity .9s ease, transform 1.1s cubic-bezier(.2,.9,.3,1.3)}
.slot.on .halo{opacity:1;transform:scale(1)}
.slot.on .halo::after{content:"";position:absolute;inset:0;border-radius:50%;background:inherit;animation:breathe 5s ease-in-out infinite;animation-delay:var(--hd,0s)}
@keyframes breathe{0%,100%{opacity:.2;transform:scale(.9)}50%{opacity:.9;transform:scale(1.15)}}
.ibox{position:relative;height:100px;display:flex;align-items:flex-end;justify-content:center}
.ico{display:grid}
.ico i{display:block;width:7px;height:7px}
.ico i.c{background:var(--w-px);opacity:0;transform:scale(.1) translateY(-14px);transition:opacity .35s ease, transform .45s cubic-bezier(.2,.9,.3,1.4);transition-delay:var(--d,0ms)}
.slot.on .ico i.c{opacity:1;transform:none;box-shadow:0 0 5px var(--w-glow)}
body.night .slot.on .ico i.c{box-shadow:0 0 6px var(--w-glow), 0 0 14px var(--w-glow)}
.slot.ghost .ico i.c{opacity:.22;transform:none;background:var(--w-ink)}
.txt{margin-top:22px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;opacity:0;transition:opacity .6s ease .35s}
.slot.on .txt{opacity:1}
.slot.ghost .txt{opacity:.55}
.nm{font-size:24px;font-weight:500;color:var(--w-ink)}
.rs{font-size:17px;color:var(--w-mute)}
.wall-foot{position:absolute;left:92px;right:92px;bottom:40px;display:flex;justify-content:space-between;align-items:center;font-size:17px;color:var(--w-mute)}
.ticker{display:flex;align-items:center;gap:10px}
.ticker .sq{width:8px;height:8px;background:var(--w-hue)}
.wall-foot .cta{font-family:var(--f-display);font-size:14px;letter-spacing:2px;color:var(--w-ink)}

/* ---------- PHONE ---------- */
.screen{width:390px;height:844px;position:relative;overflow:hidden;background:var(--sky);font-family:var(--f-body);color:var(--hud-ink)}
.cloud{position:absolute;image-rendering:pixelated;opacity:.95;animation:float-x linear infinite}
@keyframes float-x{from{transform:translateX(-140px)}to{transform:translateX(520px)}}
.star{position:absolute;width:3px;height:3px;background:#FFFFFF;animation:twinkle 3s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
.moon{position:absolute;right:46px;top:18px;filter:drop-shadow(0 0 10px rgba(255,236,190,.8))}
.scene{position:absolute;inset:0;perspective:700px;perspective-origin:50% 0}
.plane{position:absolute;left:-455px;top:-456px;width:1300px;height:1400px;transform-origin:50% 100%;transform:rotateX(58deg);transform-style:preserve-3d;background-color:var(--ground);background-image:linear-gradient(var(--grid) 2px, transparent 2px),linear-gradient(90deg, var(--grid) 2px, transparent 2px);background-size:64px 64px}
.flat{position:absolute}
.road{background:var(--road);box-shadow:0 0 0 4px var(--road-edge)}
.park{background:var(--park);border-radius:18px}
.water{background:var(--water);border-radius:30px;box-shadow:inset 0 0 0 6px rgba(255,255,255,.2)}
.lamp{border-radius:50%;background:radial-gradient(circle, rgba(255,198,110,.55), rgba(255,198,110,0) 65%)}
.b3d{position:absolute;transform-style:preserve-3d}
.b3d .rf{position:absolute;inset:0;background:var(--roof);box-shadow:inset 0 0 0 4px var(--roof-edge);display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;box-sizing:border-box;font-family:var(--f-display);font-size:15px;letter-spacing:1px;color:var(--roof-ink)}
.b3d .ws{position:absolute;left:0;width:100%;transform-origin:50% 100%;transform:rotateX(-90deg);background-color:var(--wall-s);background-image:repeating-linear-gradient(90deg, transparent 0 14px, var(--win) 14px 26px);background-size:100% 30%;background-repeat:repeat-x;background-position:0 40%}
.b3d .ww{position:absolute;top:0;left:0;height:100%;transform-origin:0 50%;transform:rotateY(-90deg);background:var(--wall-side)}
.b3d .we{position:absolute;top:0;right:0;height:100%;transform-origin:100% 50%;transform:rotateY(90deg);background:var(--wall-side)}
.bb{position:absolute;left:0;top:0;transform-origin:50% 100%}
.pix{image-rendering:pixelated;display:block}
body.night .tree{filter:brightness(.45) saturate(.7)}
body.night .person{filter:brightness(.85)}
body.night img.hi{filter:brightness(2.3) saturate(.75)}
.ring{position:absolute;border-radius:50%;border:5px dashed rgba(44,85,216,.75);animation:spin 6s linear infinite}
body.night .ring{border-color:rgba(140,170,255,.85);box-shadow:0 0 18px rgba(80,120,255,.6)}
@keyframes spin{to{transform:rotate(360deg)}}
.mk{display:flex;flex-direction:column;align-items:center;background:none;border:0;padding:0;cursor:pointer;font:inherit}
.tok{position:relative;width:58px;height:58px;border-radius:16px;background:linear-gradient(160deg,#4C7BFF,#2240B8);box-shadow:var(--tok-glow);display:flex;align-items:center;justify-content:center;animation:bob 2.6s ease-in-out infinite}
.tok .n{position:absolute;right:-12px;top:-12px;min-width:26px;height:26px;padding:0 6px;box-sizing:border-box;border-radius:13px;background:#FFFFFF;color:#2240B8;font-family:var(--f-display);font-size:13px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 0 rgba(34,64,184,.35)}
.tok.pulse{animation:bob 2.6s ease-in-out infinite, glowup 1.2s ease-out}
@keyframes glowup{0%{box-shadow:0 0 0 4px #fff, 0 0 60px 26px rgba(44,85,216,.95)}100%{box-shadow:var(--tok-glow)}}
.pole{width:5px;height:56px;background:linear-gradient(#2C55D8, rgba(44,85,216,.2))}
body.night .pole{background:linear-gradient(#8FB0FF, rgba(143,176,255,.15));box-shadow:0 0 10px rgba(120,155,255,.7)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.av{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0;cursor:pointer;font:inherit}
.tag{display:flex;align-items:center;gap:6px;padding:4px 9px;border-radius:12px;background:var(--hud-solid);color:var(--hud-ink);font-size:15px;font-weight:600;box-shadow:0 2px 0 rgba(10,20,50,.25);white-space:nowrap}
.tag.me{background:#2C55D8;color:#FFFFFF;font-family:var(--f-display);font-size:13px;font-weight:400}
.shadow{width:44px;height:12px;border-radius:50%;background:rgba(10,30,30,.3);margin-top:-6px}
.you-ring{position:absolute;border-radius:50%;border:4px solid rgba(255,255,255,.85);animation:ripple 2.4s ease-out infinite}
body.night .you-ring{border-color:rgba(160,190,255,.8)}
@keyframes ripple{0%{transform:scale(.3);opacity:1}100%{transform:scale(1.4);opacity:0}}
.fog{position:absolute;left:0;right:0;top:50px;height:150px;background:var(--fog);pointer-events:none}
.hud-top{position:absolute;left:14px;right:14px;top:14px;display:flex;justify-content:space-between;align-items:flex-start}
.me-pill{display:flex;align-items:center;gap:10px;padding:5px 14px 5px 5px;border-radius:30px;background:var(--hud-bg);box-shadow:0 3px 0 rgba(10,20,50,.2)}
.me-pill .face{width:44px;height:44px;border-radius:50%;background:var(--hud-soft);border:3px solid #2C55D8;display:flex;align-items:center;justify-content:center;box-sizing:border-box;overflow:hidden}
.me-pill .who{display:flex;flex-direction:column;gap:2px}
.me-pill .who b{font-family:var(--f-display);font-weight:400;font-size:12px;color:var(--hud-accent);letter-spacing:1px}
.me-pill .who span{font-size:13px;color:var(--hud-ink)}
.sky-pill{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:20px;background:var(--hud-bg);font-family:var(--f-display);font-size:11px;color:var(--hud-ink);box-shadow:0 3px 0 rgba(10,20,50,.2)}
.note{position:absolute;left:50%;top:76px;transform:translateX(-50%);padding:5px 10px;border-radius:12px;background:var(--hud-bg);font-size:12px;color:var(--hud-mute);white-space:nowrap}
.hud-bot{position:absolute;left:14px;right:14px;bottom:20px;display:flex;align-items:flex-end;justify-content:space-between}
.hud-btn{width:56px;height:56px;border-radius:50%;background:var(--hud-solid);border:0;color:var(--hud-accent);box-shadow:0 4px 0 rgba(10,20,50,.25);display:flex;align-items:center;justify-content:center;cursor:pointer}
.main-btn{width:78px;height:78px;border-radius:50%;background:var(--hud-solid);border:6px solid var(--hud-accent);box-sizing:border-box;box-shadow:0 5px 0 rgba(10,20,50,.3), 0 0 0 6px rgba(255,255,255,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;font-family:var(--f-display);font-size:10px;color:var(--hud-accent)}
body.night .main-btn{box-shadow:0 5px 0 rgba(0,0,0,.4), 0 0 26px rgba(120,155,255,.6)}
.nearby{width:118px;padding:8px 10px;border-radius:14px;background:var(--hud-solid);box-shadow:0 4px 0 rgba(10,20,50,.25);display:flex;flex-direction:column;gap:6px;border:0;cursor:pointer;font:inherit;text-align:left}
.nearby b{font-family:var(--f-display);font-weight:400;font-size:10px;color:var(--hud-accent)}
.nearby .ics{display:flex;gap:8px;align-items:flex-end}
.sheet{position:absolute;left:0;right:0;bottom:0;padding:16px 18px 24px;border-radius:26px 26px 0 0;background:var(--hud-solid);color:var(--hud-ink);box-shadow:0 -6px 30px rgba(10,20,50,.35);transform:translateY(105%);transition:transform .45s cubic-bezier(.2,.9,.3,1.1);display:flex;flex-direction:column;gap:12px}
.sheet.open{transform:none}
.sheet .grab{align-self:center;width:44px;height:5px;border-radius:3px;background:var(--hud-line)}
.sh-head{display:flex;align-items:center;gap:12px}
.sh-tok{width:52px;height:52px;border-radius:14px;background:linear-gradient(160deg,#4C7BFF,#2240B8);display:flex;align-items:center;justify-content:center;flex:none}
.sh-head h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:16px;color:var(--hud-ink)}
.sh-head p{margin:2px 0 0;font-size:14px;color:var(--hud-mute)}
.sh-x{margin-left:auto;width:44px;height:44px;border:0;background:var(--hud-soft);color:var(--hud-ink);border-radius:50%;cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center}
.rows{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:var(--hud-soft)}
.prow .meta{display:flex;flex-direction:column;gap:1px;flex:1;min-width:0}
.prow .meta b{font-size:16px;font-weight:600}
.prow .meta span{font-size:13px;color:var(--hud-mute)}
.more{margin:0;font-size:13px;color:var(--hud-mute)}
.row-ask{height:40px;padding:0 14px;border-radius:20px;border:0;background:#2C55D8;color:#FFFFFF;font-family:var(--f-display);font-size:11px;cursor:pointer}
.starter{padding:10px 12px;border-radius:12px;border:2px dashed var(--hud-line);font-size:15px;color:var(--hud-ink)}
.starter em{font-style:normal;font-family:var(--f-display);font-size:10px;color:var(--hud-accent);margin-right:6px}
.big-ask{height:48px;border-radius:24px;border:0;background:#2C55D8;color:#FFFFFF;font-family:var(--f-display);font-size:13px;letter-spacing:1px;cursor:pointer}
.toast{position:absolute;left:50%;top:110px;transform:translate(-50%,-20px);opacity:0;padding:8px 14px;border-radius:16px;background:#24305A;color:#FFFFFF;font-size:14px;transition:.3s;pointer-events:none;white-space:nowrap}

.toast.show{opacity:1;transform:translate(-50%,0)}

.paused *, .paused *::before, .paused *::after{animation-play-state:paused !important}
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation:none !important;transition:none !important} }
</style>

<div class="shell">
  <div class="top">
    <div class="brand"><h1>BERKELEY LOOKS OUT</h1></div>
    <div class="ctrls">
      <div class="seg" role="group" aria-label="Time of day">
        <button type="button" id="mDay" aria-pressed="false">DAY</button>
        <button type="button" id="mNight" aria-pressed="true">NIGHT</button>

function fromHash(){ setMode(location.hash==='#day'?'day':'night'); }
bD.addEventListener('click',function(){ location.hash='day'; setMode('day'); });
bN.addEventListener('click',function(){ location.hash='night'; setMode('night'); });
window.addEventListener('hashchange',fromHash);
fromHash();
updateCount();
function fit(){
  var wf=document.getElementById('wallFrame'), ws=document.getElementById('wallScaler');
  ws.style.transform='scale('+(wf.clientWidth/1600)+')';
  var pc=document.getElementById('phoneClip'), ps=document.getElementById('phoneScaler');
  ps.style.transform='scale('+(pc.clientWidth/390)+')';
}
fit(); window.addEventListener('resize',fit);
if(window.ResizeObserver){ var ro=new ResizeObserver(fit); ro.observe(document.getElementById('wallFrame')); ro.observe(document.getElementById('phoneClip')); }
setInterval(function(){ if(document.body.classList.contains('paused')||reduce) return; Math.random()<.55?arrive():depart(); }, 4200);
document.getElementById('arrive').addEventListener('click',arrive);
var pb=document.getElementById('pause');
pb.addEventListener('click',function(){ var p=document.body.classList.toggle('paused'); pb.setAttribute('aria-pressed',String(p)); pb.textContent=p?'RESUME MOTION':'PAUSE MOTION'; });
})();
</script>
