<style>
/* Layout: same two stages (16:9 wall + phone) in a book-page look: white paper, ink line drawing, one leaf green, italic serif titles, hand-lettered labels, rounded "leaf" squares as the pixel unit. Single light look by choice. */
:root{
  --paper:#FFFFFF;
  --ink:#1F1D1D;
  --mute:#6E6A66;
  --green:#8BB862;
  --green-soft:#DCEBCB;
  --grey:#9A9A9A;
  --f-title:'EB Garamond', Garamond, 'Times New Roman', serif;
  --f-hand:'Amatic SC', 'Comic Sans MS', cursive;
  color-scheme: light;
}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f-title);font-size:17px}
.shell{max-width:1480px;margin:0 auto;padding-block:28px 48px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));display:flex;flex-direction:column;gap:22px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px}
.top h1{margin:0;font-style:italic;font-weight:400;font-size:30px}
.ctrls{display:flex;gap:10px;flex-wrap:wrap}
.btn{font-family:var(--f-hand);font-weight:700;font-size:22px;letter-spacing:.5px;height:44px;padding:0 16px;border:1.5px solid var(--ink);background:var(--paper);color:var(--ink);cursor:pointer;border-radius:4px 14px 4px 14px}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn:focus-visible,.ph button:focus-visible,.ph .hit:focus-visible{outline:2px solid var(--green);outline-offset:3px}
.stages{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:32px;align-items:start}
@media (max-width:980px){.stages{grid-template-columns:minmax(0,1fr)}.fig-phone{justify-self:center;width:100%;max-width:360px}}
figure{margin:0;display:flex;flex-direction:column;gap:10px;min-width:0}
figcaption{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:16px;color:var(--mute)}
figcaption b{font-family:var(--f-hand);font-weight:700;font-size:22px;color:var(--ink)}
.wall-frame{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;overflow:hidden;background:var(--paper);border:1.5px solid var(--ink)}
.phone-frame{position:relative;width:100%;aspect-ratio:390/844;max-width:100%;border:1.5px solid var(--ink);border-radius:46px;padding:9px;box-sizing:border-box;background:var(--paper)}
.phone-clip{position:relative;width:100%;height:100%;border-radius:36px;overflow:hidden;background:var(--paper);box-shadow:inset 0 0 0 1px rgba(31,29,29,.15)}
.scaler{position:absolute;left:0;top:0;transform-origin:0 0}
.leaf{display:inline-block;border-radius:22% 48% 22% 48%;background:var(--ink)}

/* ---------- WALL ---------- */
.wall{width:1600px;height:900px;position:relative;overflow:hidden;background:var(--paper);color:var(--ink);font-family:var(--f-title)}
.wall h2{position:absolute;left:100px;top:96px;margin:0;font-style:italic;font-weight:400;font-size:92px;line-height:1;letter-spacing:-.5px}
.confetti{position:absolute;left:820px;top:30px;width:260px;height:190px}
.confetti .leaf{position:absolute;animation:hover 6s ease-in-out infinite}
@keyframes hover{0%,100%{transform:translate(0,0)}50%{transform:translate(4px,-8px)}}
.wgrid{position:absolute;left:100px;top:270px;width:1000px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));row-gap:28px}
.slot{position:relative;height:182px;display:flex;flex-direction:column;align-items:flex-start}
.ibox{height:100px;display:flex;align-items:flex-end}
.ico{display:grid;gap:1px}
.ico i{display:block;width:7px;height:7px}
.ico i.c{background:var(--ink);border-radius:1px 3.5px 1px 3.5px;opacity:0;transform:scale(0) rotate(-30deg);transition:opacity .3s ease, transform .5s cubic-bezier(.2,.9,.3,1.5), background .8s ease;transition-delay:var(--d,0ms)}
.slot.on .ico i.c{opacity:1;transform:none}
.slot.new .ico i.c{background:var(--green)}
.slot.ghost .ico i.c{opacity:1;transform:none;background:#CFCFCF}
.lbl{margin-top:12px;display:flex;flex-direction:column;gap:0;opacity:0;transition:opacity .6s ease .4s}
.slot.on .lbl,.slot.ghost .lbl{opacity:1}
.lbl .nm{font-family:var(--f-hand);font-weight:700;font-size:32px;line-height:1;text-transform:uppercase}
.lbl .rs{font-style:italic;font-size:21px;color:var(--mute)}
.note{position:absolute;pointer-events:none;transition:left .8s cubic-bezier(.3,.8,.3,1), top .8s cubic-bezier(.3,.8,.3,1), opacity .4s}
.note span{position:absolute;left:58px;top:-34px;font-family:var(--f-hand);font-weight:700;font-size:30px;white-space:nowrap}
.wside{position:absolute;left:1190px;top:280px;width:290px;font-size:27px;line-height:1.42}
.wside em{font-style:italic}
.wside .k{color:#5E8E37;font-style:italic}
.wfoot{position:absolute;left:100px;right:100px;bottom:40px;display:flex;justify-content:space-between;font-size:19px;color:var(--mute)}
.count{position:absolute;right:46px;top:270px;display:flex;flex-direction:column;gap:12px}
.count .leaf{width:20px;height:18px;transition:background .6s}
.count .leaf.g{background:var(--green);width:26px;height:24px;margin-left:-3px}
.count .leaf.e{background:#B5B5B5}

/* ---------- PHONE ---------- */
.ph{width:390px;height:844px;position:relative;overflow:hidden;background:var(--paper);font-family:var(--f-title);color:var(--ink)}

.srch{position:relative;height:40px;display:flex;align-items:center}

.chips{display:flex;gap:14px;flex-wrap:nowrap;overflow:hidden}

.ph-cap{position:absolute;left:22px;right:22px;bottom:86px;font-style:italic;font-size:14px;color:var(--mute);text-align:center}
.bar{position:absolute;left:22px;right:22px;bottom:30px;display:flex;justify-content:space-between;align-items:center}
.bar .tabs{display:flex;gap:18px}

.bar .tabs button[aria-current="true"]{color:var(--ink);text-decoration:underline;text-decoration-color:var(--green);text-decoration-thickness:3px;text-underline-offset:4px}
.offer{height:44px;padding:0 16px;background:var(--ink);color:var(--paper);border:0;border-radius:4px 16px 4px 16px;font-family:var(--f-hand);font-weight:700;font-size:22px;cursor:pointer}
.sheet{position:absolute;left:0;right:0;bottom:0;padding:22px 22px 30px;background:var(--paper);border-top:1.5px solid var(--ink);transform:translateY(105%);transition:transform .45s cubic-bezier(.2,.9,.3,1.1);display:flex;flex-direction:column;gap:12px}
.sheet.open{transform:none}
.sh-head{display:flex;align-items:flex-start;gap:12px}
.sh-head h4{margin:0;font-style:italic;font-weight:400;font-size:28px;line-height:1.1}
.sh-head p{margin:2px 0 0;font-size:16px;color:var(--mute)}
.sh-x{margin-left:auto;flex:none;width:44px;height:44px;border:1.5px solid var(--ink);border-radius:4px 14px 4px 14px;background:none;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center}
.prow{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px dashed #BDBDBD}
.prow .meta{flex:1;min-width:0;display:flex;flex-direction:column}
.prow .meta b{font-family:var(--f-hand);font-weight:700;font-size:23px;line-height:1}
.prow .meta span{font-style:italic;font-size:16px;color:var(--mute)}
.ask{height:40px;padding:0 14px;background:none;border:1.5px solid var(--ink);border-radius:4px 14px 4px 14px;font-family:var(--f-hand);font-weight:700;font-size:20px;color:var(--ink);cursor:pointer}
.starter{font-style:italic;font-size:19px;line-height:1.35;padding:4px 0 4px 12px;border-left:3px solid var(--green)}
.big{height:48px;background:var(--ink);color:var(--paper);border:0;border-radius:4px 18px 4px 18px;font-family:var(--f-hand);font-weight:700;font-size:24px;cursor:pointer}
.more{margin:0;font-style:italic;font-size:15px;color:var(--mute)}
.toast{position:absolute;left:50%;top:176px;transform:translate(-50%,-10px);opacity:0;background:var(--green);color:var(--ink);font-family:var(--f-hand);font-weight:700;font-size:20px;padding:4px 14px;border-radius:4px 14px 4px 14px;white-space:nowrap;transition:.3s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}

.paused *, .paused *::before, .paused *::after{animation-play-state:paused !important}
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation:none !important;transition:none !important} .arrow{stroke-dashoffset:0} }
