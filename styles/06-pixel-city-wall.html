<title>Berkeley Looks Out Pixel City</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Pixelify+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: same two stages (16:9 wall + phone). Both are dense isometric pixel cities drawn on small canvases and scaled up with hard pixels; UI uses hard black borders and offset shadows. Single light look by choice. */
:root{
  --page:#EEEBE4;
  --ink:#1C1B22;
  --mute:#57545F;
  --card:#FFFFFF;
  --hi:#F2C94C;
  --f-px:'Silkscreen','Courier New',monospace;
  --f:'Pixelify Sans','Trebuchet MS',system-ui,sans-serif;
  color-scheme: light;
}
html,body{background:var(--page);color:var(--ink)}
body{font-family:var(--f);font-size:16px}
.shell{max-width:1480px;margin:0 auto;padding-block:26px 48px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));display:flex;flex-direction:column;gap:24px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px}
.top h1{margin:0;font-family:var(--f-px);font-weight:700;font-size:26px;letter-spacing:1px}
.top p{margin:4px 0 0;color:var(--mute)}
.ctrls{display:flex;gap:12px;flex-wrap:wrap}
.btn{font-family:var(--f-px);font-size:13px;height:44px;padding:0 16px;border:3px solid var(--ink);background:var(--card);color:var(--ink);cursor:pointer;box-shadow:4px 4px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.btn.primary{background:var(--hi)}
.btn:focus-visible,.chip:focus-visible,.ask:focus-visible,.x:focus-visible,input:focus-visible{outline:3px solid #2F80ED;outline-offset:3px}
.stages{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:32px;align-items:start}
@media (max-width:980px){.stages{grid-template-columns:minmax(0,1fr)}.fig-phone{justify-self:center;width:100%;max-width:360px}}
figure{margin:0;display:flex;flex-direction:column;gap:12px;min-width:0}
figcaption{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:15px;color:var(--mute)}
figcaption b{font-family:var(--f-px);font-weight:400;font-size:13px;color:var(--ink)}
.wall-frame{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;overflow:hidden;background:#CFC9BE;border:4px solid var(--ink);box-shadow:6px 6px 0 var(--ink);box-sizing:border-box}
.phone-frame{position:relative;width:100%;aspect-ratio:390/844;max-width:100%;border:4px solid var(--ink);border-radius:44px;padding:8px;box-sizing:border-box;background:#2B2A33;box-shadow:6px 6px 0 var(--ink)}
.phone-clip{position:relative;width:100%;height:100%;border-radius:34px;overflow:hidden;background:#CFC9BE}
.scaler{position:absolute;left:0;top:0;transform-origin:0 0}
canvas.px{image-rendering:pixelated;image-rendering:crisp-edges;display:block}

/* ---------- WALL ---------- */
.wall{width:1600px;height:900px;position:relative;overflow:hidden;background:#CFC9BE}
.wall canvas{position:absolute;left:0;top:0;width:1602px;height:900px}
.tags{position:absolute;left:0;top:0;width:1600px;height:900px;pointer-events:none}
.tag{position:absolute;transform:translate(-50%,-100%);padding:3px 8px 4px;background:var(--ink);color:#fff;font-family:var(--f-px);font-size:15px;line-height:1;white-space:nowrap;border-bottom:4px solid;transition:opacity .4s}
.w-card{position:absolute;right:36px;top:36px;bottom:36px;width:420px;box-sizing:border-box;padding:28px 28px 26px;background:var(--card);border:4px solid var(--ink);box-shadow:8px 8px 0 var(--ink);display:flex;flex-direction:column;gap:22px}
.eyebrow{font-family:var(--f-px);font-size:14px;letter-spacing:1px;color:var(--mute)}
.w-card h2{margin:-8px 0 0;font-family:var(--f-px);font-weight:700;font-size:40px;line-height:1.05}
.w-card h2 small{display:block;font-family:var(--f);font-weight:400;font-size:22px;color:var(--mute);margin-top:10px}
.w-score{display:flex;align-items:center;gap:16px;padding:14px 18px;background:var(--ink);color:#fff}
.w-score b{font-family:var(--f-px);font-weight:700;font-size:62px;line-height:1;color:var(--hi);font-variant-numeric:tabular-nums}
.w-score span{font-size:20px;line-height:1.25}
.legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 18px}
.legend div{display:flex;align-items:center;gap:10px;font-size:21px;transition:opacity .4s}
.legend i{width:20px;height:20px;border:3px solid var(--ink);flex:none}
.legend em{margin-left:auto;font-style:normal;font-family:var(--f-px);font-size:17px;color:var(--mute)}
.legend div.zero{opacity:.35}
.w-new{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding-top:18px;border-top:3px dashed rgba(28,27,34,.25)}
.w-new b{font-weight:600;font-size:26px;line-height:1.2}
.w-new span{font-size:18px;color:var(--mute)}
.w-tl{position:absolute;left:24px;top:22px;padding:8px 12px;background:var(--hi);border:4px solid var(--ink);box-shadow:5px 5px 0 var(--ink);font-family:var(--f-px);font-weight:700;font-size:20px}

/* ---------- PHONE ---------- */
.ph{width:390px;height:844px;position:relative;overflow:hidden;background:#CFC9BE;font-family:var(--f);color:var(--ink)}
.view{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab}
.view:active{cursor:grabbing}
.view canvas{position:absolute;left:0;top:0;width:1520px;height:900px;transform-origin:0 0}
.p-card{position:absolute;left:12px;right:12px;top:38px;padding:12px;background:var(--card);border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);display:flex;flex-direction:column;gap:10px}
.p-card .r1{display:flex;justify-content:space-between;align-items:center}
.p-card h3{margin:0;font-family:var(--f-px);font-weight:700;font-size:20px}
.p-card .r1 span{font-family:var(--f-px);font-size:10px;color:var(--mute)}
.srch{display:flex;align-items:center;gap:8px;height:40px;padding:0 10px;border:3px solid var(--ink);background:#F7F5F0}
.srch input{flex:1;min-width:0;height:100%;border:0;background:none;font-family:var(--f);font-size:16px;color:var(--ink);padding:0}
.srch input::placeholder{color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 8px 0 6px;border:2px solid var(--ink);background:var(--card);color:var(--ink);font-family:var(--f-px);font-size:10px;cursor:pointer}
.chip i{width:10px;height:10px;border:2px solid var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff}
.chip[aria-pressed="true"] i{border-color:#fff}
.p-bot{position:absolute;left:12px;right:12px;bottom:22px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;pointer-events:none}
.p-note{padding:6px 9px;background:var(--card);border:2px solid var(--ink);font-size:13px;line-height:1.25;max-width:190px;pointer-events:auto}
.p-bot .btn{pointer-events:auto;height:48px}
.sheet{position:absolute;left:10px;right:10px;bottom:10px;padding:16px;background:var(--card);border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);display:flex;flex-direction:column;gap:10px;transform:translateY(calc(100% + 30px));visibility:hidden;transition:transform .35s steps(6,end), visibility 0s linear .35s}
.sheet.open{transform:none;visibility:visible;transition:transform .35s steps(6,end)}
.sh-head{display:flex;align-items:center;gap:10px}
.sh-sw{width:40px;height:40px;border:3px solid var(--ink);flex:none}
.sh-head h4{margin:0;font-family:var(--f-px);font-weight:700;font-size:17px}
.sh-head p{margin:2px 0 0;font-size:14px;color:var(--mute)}
.x{margin-left:auto;flex:none;width:44px;height:44px;border:3px solid var(--ink);background:var(--card);color:var(--ink);cursor:pointer;font-family:var(--f-px);font-size:16px}
.prow{display:flex;align-items:center;gap:10px;padding:6px 8px;border:2px solid var(--ink)}
.prow i{width:14px;height:14px;border:2px solid var(--ink);flex:none}
.prow .meta{flex:1;min-width:0;display:flex;flex-direction:column}
.prow .meta b{font-weight:600;font-size:16px}
.prow .meta span{font-size:13px;color:var(--mute)}
.ask{height:36px;padding:0 12px;border:2px solid var(--ink);background:var(--hi);color:var(--ink);font-family:var(--f-px);font-size:11px;cursor:pointer}
.starter{padding:10px;border:2px dashed var(--ink);font-size:17px;line-height:1.3}
.more{margin:0;font-size:13px;color:var(--mute)}
.toast{position:absolute;left:50%;top:250px;transform:translateX(-50%);opacity:0;display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--ink);color:#fff;font-family:var(--f-px);font-size:10px;white-space:nowrap;transition:opacity .2s;pointer-events:none}
.toast i{width:10px;height:10px;border:2px solid #fff}
.toast.show{opacity:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion: reduce){ *{transition:none !important} }
</style>

<div class="shell">
  <div class="top">
    <div><h1>BERKELEY LOOKS OUT</h1><p>A pixel city of people, skills and resources</p></div>
    <div class="ctrls">
      <button class="btn primary" id="arrive" type="button">Someone walks in</button>
      <button class="btn" id="pause" type="button" aria-pressed="false">Pause</button>
    </div>
  </div>
  <div class="stages">
    <figure>
      <div class="wall-frame" id="wallFrame"><div class="scaler" id="wallScaler">
        <div class="wall">
          <canvas class="px" id="wallCanvas" width="534" height="300" aria-label="Pixel-art plaza in front of Wurster Hall. Each person offering help stands at a small stall under a sign with their resource."></canvas>
          <div class="tags" id="tags"></div>
          <div class="w-tl">LOOKS OUT</div>
          <div class="w-card">
            <div class="eyebrow" id="wClock">LIVE</div>
            <h2>WURSTER HALL<small>Our building, our resources</small></h2>
            <div class="w-score"><b id="wCount">12</b><span>people inside<br>offering something</span></div>
            <div class="legend" id="legend"></div>
            <div class="w-new"><span class="eyebrow" id="wNewL">HOW IT WORKS</span><b id="wNew">Walk in and your stall opens</b><span id="wNewSub">Leave and the sign switches off</span></div>
          </div>
        </div>
      </div></div>
      <figcaption><b>RESOURCE WALL</b><span>Wurster Hall lobby · 16:9 screen</span></figcaption>
    </figure>
    <figure class="fig-phone">
      <div class="phone-frame"><div class="phone-clip" id="phoneClip"><div class="scaler" id="phoneScaler">
        <div class="ph">
          <div class="view" id="view"><canvas class="px" id="phoneCanvas" width="760" height="450" aria-label="Pixel-art map of the Berkeley campus. Buildings with people offering help carry a lit sign with an icon and a count."></canvas></div>
          <div class="p-card">
            <div class="r1"><h3>LOOKS OUT</h3><span id="pClock">LIVE</span></div>
            <div class="srch">
              <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true" shape-rendering="crispEdges"><path d="M2 2h8v2H2zM2 8h8v2H2zM0 4h2v4H0zM10 4h2v4h-2zM11 11h2v2h-2zM13 13h2v2h-2z" fill="#1C1B22"/></svg>
              <label class="sr" for="q">Search skills and resources</label>
              <input id="q" type="search" placeholder="What are you looking for?">
            </div>
            <div class="chips" id="chips" role="group" aria-label="Filter by kind of help"></div>
          </div>
          <div class="p-bot"><span class="p-note">Drag to explore. Signs show buildings, never where a person is.</span><button class="btn primary" id="offer" type="button">+ OFFER</button></div>
          <div class="toast" id="toast" role="status"></div>
          <div class="sheet" id="sheet" aria-live="polite"></div>
        </div>
      </div></div></div>
      <figcaption><b>CAMPUS MAP</b><span>Tap a building with a sign</span></figcaption>
    </figure>
  </div>
</div>

    var inside=false; for(var i=0,j=pts.length-1;i<pts.length;j=i++){ var xi=pts[i][0],yi=pts[i][1],xj=pts[j][0],yj=pts[j][1]; if(((yi>ly)!==(yj>ly))&&(lx<(xj-xi)*(ly-yi)/(yj-yi)+xi)) inside=!inside; }
    var sb=b.signBox; if(sb&&lx>=sb[0]-3&&lx<=sb[0]+sb[2]+3&&ly>=sb[1]-3&&ly<=sb[1]+sb[3]+8) inside=true;
    if(inside&&(!hit||b.sp.key>BLD[hit].sp.key)) hit=k; });
  if(hit) openBuilding(hit); });

function openBuilding(k){
  var all=offersOf(k), list=curF?all.filter(function(o){ return o.c===curF; }):all;

  sheet.appendChild(head(curF?CATS[curF].c:'#F2C94C',BLD[k].n,list.length+(curF?' offering '+CATS[curF].t.toLowerCase():' people offering inside right now')));

  });

}

/* render loop */
function sortKey(o){ if(o.key!=null&&typeof o.key==='number'&&!o.xy&&!o.path) return o.key; if(o.xy){ var q=o.xy(); return q[0]+q[1]; } if(o.path) return o.x+o.y; return o.key; }
function render(ctx,bg,objs,P,W,H){
  ctx.drawImage(bg,0,0);
  objs.slice().sort(function(a,b){ return sortKey(a)-sortKey(b); }).forEach(function(o){ o.draw(ctx,P); });
}
var last=performance.now();
function frame(t){
  var dt=Math.min(.05,(t-last)/1000); last=t;
  var moving=!paused&&!reduce;
  if(moving){ clock+=dt; walkersW.slice().forEach(function(w){ w.update(dt); }); carsW.forEach(function(c){ c.update(dt); }); walkersP.slice().forEach(function(w){ w.update(dt); }); carsP.forEach(function(c){ c.update(dt); }); }
  stalls.concat(WOBJ.filter(function(o){ return o.state==='close'; })).forEach(function(s){ s.update(dt); });
  Object.keys(BLD).forEach(function(k){ if(BLD[k].flash>0) BLD[k].flash-=dt; });
  render(wctx,wGround,WOBJ,WP);
  render(pctx,pGround,POBJ,PPt);
  if(moving){ waterPts.forEach(function(q,i){ if((Math.floor(clock*3)+i)%5===0){ var p=PPt.iso(q[0],q[1],0); rect(pctx,p[0],p[1],1,1,'#FFFFFF'); } }); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
