<title>Berkeley Looks Out Roads</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: same two stages (16:9 wall + phone) drawn as a tiny road-building world: cream land, navy rounded roads, flat colored blocks with long shadows, cars that carry help between places. Color = kind of help. Single light look by choice. */
:root{
  --page:#EFE8D9;
  --ink:#2E3346;
  --mute:#615E73;
  --card:#FFFFFF;
  --land:#F7F1E3;
  --road:#2E3346;
  --line:rgba(46,51,70,.14);
  --f:'Rubik','Trebuchet MS',system-ui,sans-serif;
  color-scheme: light;
}
html,body{background:var(--page);color:var(--ink)}
body{font-family:var(--f);font-size:15px}
.shell{max-width:1480px;margin:0 auto;padding-block:26px 48px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));display:flex;flex-direction:column;gap:22px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px}
.top h1{margin:0;font-weight:700;font-size:26px;letter-spacing:-.3px}
.top p{margin:2px 0 0;color:var(--mute);font-size:14px}
.ctrls{display:flex;gap:10px;flex-wrap:wrap}
.btn{font-family:var(--f);font-weight:600;font-size:14px;height:44px;padding:0 18px;border:0;border-radius:22px;background:var(--card);color:var(--ink);cursor:pointer;box-shadow:0 2px 0 rgba(46,51,70,.12)}
.btn.primary{background:var(--road);color:#fff}
.btn:focus-visible,.chip:focus-visible,.ask:focus-visible,.x:focus-visible,.round:focus-visible,.bhit:focus-visible,input:focus-visible{outline:3px solid #F39A2B;outline-offset:2px}
.stages{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:32px;align-items:start}
@media (max-width:980px){.stages{grid-template-columns:minmax(0,1fr)}.fig-phone{justify-self:center;width:100%;max-width:360px}}
figure{margin:0;display:flex;flex-direction:column;gap:10px;min-width:0}
figcaption{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--mute)}
figcaption b{font-weight:600;color:var(--ink)}
.wall-frame{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;overflow:hidden;border-radius:18px;background:var(--land);box-shadow:0 10px 30px rgba(46,51,70,.12)}
.phone-frame{position:relative;width:100%;aspect-ratio:390/844;max-width:100%;border-radius:50px;padding:9px;box-sizing:border-box;background:var(--road);box-shadow:0 10px 30px rgba(46,51,70,.2)}
.phone-clip{position:relative;width:100%;height:100%;border-radius:41px;overflow:hidden;background:var(--land)}
.scaler{position:absolute;left:0;top:0;transform-origin:0 0}
svg text{font-family:var(--f)}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .65s cubic-bezier(.3,1.7,.5,1) both}
.sink{transform-box:fill-box;transform-origin:center;animation:sink .5s ease-in forwards}
@keyframes pop{0%{transform:scale(0)}100%{transform:scale(1)}}
@keyframes sink{to{transform:scale(0);opacity:0}}
.drive{transition:stroke-dashoffset .7s ease}
.fade{transition:opacity .4s ease}
.float{animation:float 1.4s ease-out forwards}
@keyframes float{0%{opacity:0;transform:translateY(6px)}20%{opacity:1}100%{opacity:0;transform:translateY(-34px)}}

/* ---------- WALL ---------- */
.wall{width:1600px;height:900px;position:relative;overflow:hidden;background:var(--land);font-family:var(--f);color:var(--ink)}
.wall svg{position:absolute;left:0;top:0}
.w-card{position:absolute;right:44px;top:44px;bottom:44px;width:420px;box-sizing:border-box;padding:34px 34px 30px;background:var(--card);border-radius:28px;box-shadow:0 8px 0 rgba(46,51,70,.06), 0 18px 40px rgba(46,51,70,.1);display:flex;flex-direction:column;gap:26px}
.w-clock{display:flex;align-items:center;gap:10px;font-weight:600;font-size:17px;letter-spacing:1.5px;text-transform:uppercase;color:var(--mute)}
.w-card h2{margin:-10px 0 0;font-weight:700;font-size:50px;line-height:1.02;letter-spacing:-1px}
.w-card h2 small{display:block;font-weight:400;font-size:22px;letter-spacing:0;color:var(--mute);margin-top:8px}
.w-score{display:flex;align-items:center;gap:18px;padding:18px 22px;border-radius:20px;background:var(--page)}
.w-score b{font-weight:700;font-size:64px;line-height:1;font-variant-numeric:tabular-nums}
.w-score span{font-size:19px;line-height:1.3;color:var(--mute)}
.legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 20px}
.legend div{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:500;transition:opacity .4s}
.legend i{width:22px;height:22px;border-radius:6px;flex:none;box-shadow:3px 3px 0 rgba(46,51,70,.15)}
.legend em{margin-left:auto;font-style:normal;font-weight:600;color:var(--mute);font-variant-numeric:tabular-nums}
.legend div.zero{opacity:.35}
.w-new{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding-top:20px;border-top:2px dashed var(--line)}
.w-new .lbl{font-weight:600;font-size:15px;letter-spacing:1.5px;text-transform:uppercase;color:var(--mute)}
.w-new b{font-weight:600;font-size:26px;line-height:1.2}
.w-new span{font-size:17px;color:var(--mute)}
.w-tag{position:absolute;left:40px;top:36px;display:flex;align-items:center;gap:12px;padding:10px 18px 10px 12px;border-radius:30px;background:var(--card);box-shadow:0 4px 0 rgba(46,51,70,.08);font-weight:600;font-size:19px}
.w-tag i{width:28px;height:28px;border-radius:8px;background:var(--road);display:flex;align-items:center;justify-content:center}

/* ---------- PHONE ---------- */
.ph{width:390px;height:844px;position:relative;overflow:hidden;background:var(--land);font-family:var(--f);color:var(--ink)}
.ph svg.map{position:absolute;left:0;top:0}
.p-card{position:absolute;left:12px;right:12px;top:40px;padding:14px 14px 12px;background:var(--card);border-radius:22px;box-shadow:0 4px 0 rgba(46,51,70,.06), 0 10px 24px rgba(46,51,70,.12);display:flex;flex-direction:column;gap:10px}
.p-card .r1{display:flex;justify-content:space-between;align-items:center}
.p-card h3{margin:0;font-weight:700;font-size:21px;letter-spacing:-.3px}
.p-clock{display:flex;align-items:center;gap:6px;font-weight:600;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--mute)}
.srch{display:flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:20px;background:var(--page)}
.srch input{flex:1;min-width:0;height:100%;border:0;background:none;font-family:var(--f);font-size:16px;color:var(--ink);padding:0}
.srch input::placeholder{color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px 0 7px;border:0;border-radius:15px;background:var(--page);color:var(--ink);font-family:var(--f);font-weight:500;font-size:12.5px;cursor:pointer}
.chip i{width:12px;height:12px;border-radius:3px;flex:none}
.chip[aria-pressed="true"]{background:var(--road);color:#fff}
.p-bot{position:absolute;left:14px;right:14px;bottom:24px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.p-note{padding:8px 12px;border-radius:14px;background:rgba(255,255,255,.9);font-size:11.5px;line-height:1.3;color:var(--mute);max-width:180px;box-shadow:0 3px 0 rgba(46,51,70,.06)}
.round{position:relative;width:64px;height:64px;border-radius:50%;border:0;background:var(--road);color:#fff;font-family:var(--f);font-weight:600;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;box-shadow:0 5px 0 rgba(46,51,70,.25)}
.round svg{display:block}
.bhit{cursor:pointer;outline:none}
.sheet{position:absolute;left:10px;right:10px;bottom:10px;padding:18px 18px 20px;background:var(--card);border-radius:26px;box-shadow:0 -4px 30px rgba(46,51,70,.2);display:flex;flex-direction:column;gap:12px;transform:translateY(calc(100% + 30px));visibility:hidden;transition:transform .45s cubic-bezier(.2,.9,.3,1.15), visibility 0s linear .45s}
.sheet.open{transform:none;visibility:visible;transition:transform .45s cubic-bezier(.2,.9,.3,1.15)}
.sh-head{display:flex;align-items:center;gap:12px}
.sh-sw{width:42px;height:42px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;box-shadow:4px 4px 0 rgba(46,51,70,.15)}
.sh-head h4{margin:0;font-weight:700;font-size:20px}
.sh-head p{margin:2px 0 0;font-size:13px;color:var(--mute)}
.x{margin-left:auto;flex:none;width:44px;height:44px;border-radius:50%;border:0;background:var(--page);color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center}
.prow{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:14px;background:var(--page)}
.prow i{width:14px;height:14px;border-radius:4px;flex:none}
.prow .meta{flex:1;min-width:0;display:flex;flex-direction:column}
.prow .meta b{font-weight:600;font-size:16px}
.prow .meta span{font-size:13px;color:var(--mute)}
.ask{height:36px;padding:0 16px;border:0;border-radius:18px;background:var(--road);color:#fff;font-family:var(--f);font-weight:600;font-size:13px;cursor:pointer}
.starter{padding:12px 14px;border-radius:14px;background:var(--page);font-size:17px;line-height:1.35}
.more{margin:0;font-size:13px;color:var(--mute)}
.toast{position:absolute;left:50%;top:252px;transform:translate(-50%,-8px);opacity:0;display:flex;align-items:center;gap:8px;padding:8px 14px 8px 10px;border-radius:18px;background:var(--road);color:#fff;font-weight:500;font-size:13px;white-space:nowrap;transition:.3s;pointer-events:none}
.toast i{width:12px;height:12px;border-radius:3px}
.toast.show{opacity:1;transform:translate(-50%,0)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation:none !important;transition:none !important} }
</style>

<div class="shell">
  <div class="top">
    <div><h1>Berkeley Looks Out</h1><p>Every road carries a little help across campus</p></div>
    <div class="ctrls">
      <button class="btn primary" id="arrive" type="button">Someone walks in</button>
      <button class="btn" id="pause" type="button" aria-pressed="false">Pause traffic</button>
    </div>
  </div>
  <div class="stages">
    <figure>
      <div class="wall-frame" id="wallFrame"><div class="scaler" id="wallScaler">
        <div class="wall">
          <svg id="wallSvg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Wurster Hall in the middle, with a small colored house on a driveway for each person offering help inside"></svg>
          <div class="w-tag"><i><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 15V6l5-4 5 4v9" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg></i>Berkeley Looks Out</div>
          <div class="w-card">
            <div class="w-clock"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="7.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9 4.5V9l3 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span id="wClock">Live</span></div>
            <h2>Wurster Hall<small>Our building, our resources</small></h2>
            <div class="w-score"><b id="wCount">12</b><span>people inside<br>offering something</span></div>
            <div class="legend" id="legend"></div>
            <div class="w-new"><span class="lbl" id="wNewL">How it works</span><b id="wNew">Your house appears when you walk in</b><span id="wNewSub">and drives away when you leave</span></div>
          </div>
        </div>
      </div></div>
      <figcaption><b>Resource wall</b><span>Wurster Hall lobby · 16:9 screen</span></figcaption>
    </figure>
    <figure class="fig-phone">
      <div class="phone-frame"><div class="phone-clip" id="phoneClip"><div class="scaler" id="phoneScaler">
        <div class="ph">
          <svg class="map" id="phoneSvg" width="390" height="844" viewBox="0 0 390 844" role="group" aria-label="Map of the Berkeley campus. Each building shows colored squares for the people offering help inside."></svg>
          <div class="p-card">
            <div class="r1"><h3>Looks Out</h3><span class="p-clock"><svg width="12" height="12" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="7.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9 4.5V9l3 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span id="pClock">Live</span></span></div>
            <div class="srch">
              <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="#615E73" stroke-width="1.8"/><path d="M11 11l4 4" stroke="#615E73" stroke-width="1.8" stroke-linecap="round"/></svg>
              <label class="sr" for="q">Search skills and resources</label>
              <input id="q" type="search" placeholder="What are you looking for?">
            </div>
            <div class="chips" id="chips" role="group" aria-label="Filter by kind of help"></div>
          </div>
          <div class="p-bot">
            <span class="p-note">A drawn campus. It shows buildings, never where a person is.</span>
            <button class="round" id="offer" type="button" aria-label="Offer something"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3v14M3 10h14" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg>Offer</button>
          </div>
          <div class="toast" id="toast" role="status"></div>
          <div class="sheet" id="sheet" aria-live="polite"></div>
        </div>
      </div></div></div>
      <figcaption><b>Campus map</b><span>Tap a building to see who can help</span></figcaption>
    </figure>
  </div>
</div>
